name: CodeQL Analysis

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC

# New PR commits supersede older checks; keep every non-PR run independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bound compiler memory use while taking advantage of multiple runner cores.
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  analyze:
    name: CodeQL C++
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        language: ['cpp']
    
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality
        config-file: ./.github/codeql/codeql-config.yml

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCSV_CXX_STANDARD=20 \
          -DCSV_BUILD_PROGRAMS=OFF \
          -DCSV_BUILD_TESTS=OFF \
          -DBUILD_PYTHON=OFF \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_C_COMPILER=gcc
    
    - name: Build for CodeQL analysis
      run: cmake --build build --config Release
    
    - name: Run CodeQL analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
